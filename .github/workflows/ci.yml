name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Fuzz
        run: go test -fuzz=FuzzUrgencyScore -fuzztime=10s ./test/unit/

      - name: Benchmark
        run: go test -bench=. -benchmem -run=^$$ ./test/unit/
