services:
  api-sqlite:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/parts.db
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-memory:
    build: .
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - IN_MEMORY=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sqlite-data:
